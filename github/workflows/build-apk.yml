name: Build & Publish YT Gemini APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode Release Keystore (if GitHub Secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
            echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/release.jks" >> $GITHUB_ENV
            echo "Using permanent Studio Mogli release keystore."
          else
            echo "No KEYSTORE_BASE64 secret found. Building release APK with fallback key."
          fi

      - name: Extract App Version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "APP_VERSION=$VERSION_NAME" >> $GITHUB_ENV
          echo "Detected version: $VERSION_NAME"

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK for sharing
        run: |
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/YTGemini-v${APP_VERSION}-StudioMogli.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTGemini-v${{ env.APP_VERSION }}-release-apk
          path: app/build/outputs/apk/release/YTGemini-v${{ env.APP_VERSION }}-StudioMogli.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}"
          APK_FILE="app/build/outputs/apk/release/YTGemini-v${APP_VERSION}-StudioMogli.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" \
              --title "YT Gemini ${TAG} — Creator OS by Studio Mogli" \
              --notes "5-Tab Creator OS: Accountability Radar, Voice-to-Script Workbench, Zero-API-Key Gemini Lab, Face/Mask Asset Gallery, and Isolated YouTube Studio — built by Studio Mogli (studiomogli.com)."
          fi
